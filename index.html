<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 検索エンジンにオリジナルサイトを伝える（SEOコピー対策） -->
    <link rel="canonical" href="https://kyuni-f.github.io/pet925/">
    <!-- faviconのエラー（404）をより確実に回避するための設定 -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XR7TWP7ZJ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XR7TWP7ZJ0', {
        'send_page_view': true,
        'cookie_domain': 'none'
      });
    </script>
    <title>pet925 | Premium Pet Nutrition</title>
    <meta name="description" content="愛犬・愛猫へのこだわりから最適なプレミアムフードを見つける選定ガイド。グレインフリー、特定のタンパク源、低カロリーなど、飼い主様のこだわりから最高の一皿を提案します。">

    <script>
        // 1. 最初にマスタデータを読み込み siteVersion を確定させる
        const timestamp = Date.now();
        document.write('<script src="data_master.js?v=' + timestamp + '"><\/script>');
    </script>
    <script>
        // 2. 確定した siteVersion を使い、スタイルとメインロジックを同期的に読み込む
        // これにより ReferenceError (render is not defined 等) を防ぎます
        const version = (typeof siteVersion !== 'undefined') ? siteVersion : timestamp;
        document.write('<link rel="stylesheet" href="style.css?v=' + version + '">');
        document.write('<script src="main.js?v=' + version + '"><\/script>');
    </script>
</head>
<body>
<header>
    <h1>pet925</h1>
    <div class="sub-copy">Scientific Nutrition x High Style</div>
    <div class="site-intro">
        ー愛犬・愛猫にぴったりのフードを探せるお手伝いをー
    </div>
</header>

<div class="container">
    <!-- 検索・フィルターView -->
    <div id="view-search">
        <div class="search-container">
            <div style="font-size: 0.7rem; color: #999; margin-bottom: 8px; letter-spacing: 1px;">SEARCH BY NAME, BRAND OR INGREDIENT</div>
            <input type="text" id="search-input" placeholder="商品名、ブランド、キーワードがあれば入力" oninput="render(true)">
        </div>
        <div class="search-screen-fav-area">
            <button id="fav-filter-btn-search-screen" class="fav-toggle-btn" onclick="toggleFavFilter()">お気に入り <span style="color:#ff4757">❤</span></button>
        </div>
        <div class="filter-nav" id="filter-nav-container"></div>

        <div class="floating-action-area">
            <button id="main-submit-btn" class="btn-primary-action" onclick="showResults()">SHOW RESULTS</button>
        </div>
    </div>

    <!-- 結果一覧View -->
    <div id="view-results">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; margin-bottom: 15px; padding-bottom: 5px;">
            <button class="btn-back-to-search" onclick="backToSearch()">← 検索条件に戻る</button>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="clear-fav-btn" class="clear-all" style="display: none; margin: 0;" onclick="clearAllFavorites()">CLEAR ❤ ×</button>
                <button id="fav-filter-btn" class="fav-toggle-btn" onclick="toggleFavFilter()">お気に入り <span style="color:#ff4757">❤</span></button>
            </div>
        </div>
        <div id="active-chips-container" class="active-chips-area"></div>
        <div id="product-list"></div>
        <div id="load-more-area" class="load-more-container"></div>
    </div>

    <!-- カスタム確認モーダルHTML -->
    <div id="fav-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">❤</div>
            <div class="modal-text">お気に入りをすべて<br>解除しますか？</div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeFavModal()">やめる</button>
                <button class="modal-btn btn-confirm" onclick="executeClearAllFavorites()">解除する</button>
            </div>
        </div>
    </div>

    <!-- 画像拡大モーダル -->
    <div id="image-modal-overlay" class="modal-overlay" onclick="closeImageModal()">
        <div class="image-modal-content" onclick="event.stopPropagation()">
            <img id="modal-expanded-img" src="" alt="">
            <button class="modal-close-btn" onclick="closeImageModal()">&times;</button>
        </div>
    </div>

    <!-- トップに戻るボタン（フローティング） -->
    <button id="floating-back-to-top" class="btn-floating-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="ページトップへ戻る">↑</button>

    <footer>
        &copy; 2024-2026 pet925. All Rights Reserved. <br>
        Reproduction of content is strictly prohibited.
    </footer>
</div>
</body>
</html>
