<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- faviconのエラー（404）をより確実に回避するための設定 -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XR7TWP7ZJ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XR7TWP7ZJ0', {
        'send_page_view': true,
        'cookie_domain': 'none'
      });
    </script>
    <title>pet925 | Premium Pet Nutrition</title>
    <meta name="description" content="愛犬・愛猫へのこだわりから最適なプレミアムフードを見つける選定ガイド。グレインフリー、特定のタンパク源、低カロリーなど、飼い主様のこだわりから最高の一皿を提案します。">
    <!-- マスタデータの読み込み -->
    <script src="data_master.js"></script>

    <style>
        :root { --gold: #c5a059; --dark: #1a1a1a; --gray: #f4f4f4; }
        body { font-family: "Helvetica Neue", "Hiragino Sans", sans-serif; background: #fff; color: var(--dark); margin: 0; padding-bottom: 60px; line-height: 1.6; }
        
        /* ヘッダー：スタイリッシュな小文字デザイン */
        header { 
            padding: 60px 20px; 
            text-align: center; 
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            background: #fff;
        }
        h1 { font-size: 3rem; letter-spacing: 12px; margin: 0; font-weight: 200; text-transform: none; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .sub-copy { font-size: 0.7rem; letter-spacing: 4px; color: var(--gold); margin-top: 10px; text-transform: uppercase; transition: opacity 0.3s; }
        .site-intro { max-width: 600px; margin: 30px auto 0; font-size: 0.85rem; color: #666; line-height: 1.8; transition: all 0.4s ease; opacity: 1; overflow: hidden; max-height: 200px; }

        /* --- View切り替えロジック --- */
        #view-results { display: none; }
        
        /* 結果表示モード (state-results) */
        body.state-results #view-search { display: none; }
        body.state-results #view-results { display: block; }
        
        /* 結果表示中のヘッダー（コンパクト） */
        body.state-results header { 
            padding: 15px 20px; 
            border-bottom: 1px solid #eee;
        }
        body.state-results h1 { font-size: 1.2rem; letter-spacing: 4px; }
        body.state-results .sub-copy,
        body.state-results .site-intro { opacity: 0; max-height: 0; margin: 0; }

        .container { width: 92%; max-width: 1100px; margin: 0 auto; }

        /* 実行ボタンと戻るボタン */
        .floating-action-area { 
            position: sticky; bottom: 30px; left: 0; right: 0; 
            display: flex; justify-content: center; z-index: 1001;
            pointer-events: none;
        }
        .btn-primary-action { 
            background: var(--dark); color: #fff; border: none; padding: 20px 60px; 
            font-size: 0.8rem; font-weight: bold; letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); pointer-events: auto;
            transition: 0.3s;
        }
        .btn-primary-action:hover { background: var(--gold); transform: translateY(-3px); }
        
        .btn-back-to-search { background: none; border: none; color: #999; font-size: 0.7rem; letter-spacing: 2px; cursor: pointer; padding: 20px 0; text-decoration: underline; text-underline-offset: 4px; }
        .btn-back-to-search:hover { color: var(--dark); }

        /* 検索バー：ミニマルデザイン */
        .search-container { margin: 20px auto; max-width: 600px; }
        #search-input { width: 100%; padding: 18px; border: 1px solid #eee; border-radius: 0; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box; }
        #search-input:focus { border-color: var(--dark); background: var(--gray); }

        /* こだわり条件フィルターナビゲーション */
        .filter-nav { position: sticky; top: 0; background: rgba(255,255,255,0.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 99; border-bottom: 1px solid #f0f0f0; padding: 10px 0; max-height: 80vh; overflow-y: auto; }
        .filter-group { margin-bottom: 25px; }
        
        /* カテゴリヘッダーの改善 */
        .group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 5px; cursor: pointer; user-select: none; transition: 0.2s; }
        .group-header:hover { background: var(--gray); }
        .group-label-jp { font-size: 0.95rem; font-weight: 600; color: var(--dark); }
        .group-label-en { font-size: 0.6rem; font-weight: 700; color: #bbb; letter-spacing: 1px; text-transform: uppercase; }
        .collapse-icon { font-size: 0.6rem; color: #ccc; transition: 0.3s; margin-left: auto; }
        .filter-group.collapsed .filter-wrap-box { display: none; }
        .filter-group.collapsed .collapse-icon { transform: rotate(-90deg); }

        .multi-badge { 
            font-size: 0.75rem; color: var(--gold); border: 1px solid var(--gold); 
            padding: 3px 12px; border-radius: 4px; font-weight: bold;
            background: rgba(197, 160, 89, 0.08);
            letter-spacing: 1px;
        }

        /* タイルレイアウト */
        .filter-wrap-box { display: flex; flex-wrap: wrap; gap: 8px; padding: 5px; }

        .filter-btn { 
            position: relative;
            background: #fff; border: 1px solid #eee; padding: 8px 20px; font-size: 0.75rem; 
            transition: 0.3s; cursor: pointer; white-space: nowrap; border-radius: 2px;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .filter-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); font-weight: bold; }

        /* 複数選択ボタンがアクティブな時のチェックマーク */
        .filter-group[data-multiselect="true"] .filter-btn:not([data-val="all"]) {
            padding-left: 32px; /* チェックマーク用のスペースを常に確保 */
        }
        .filter-group[data-multiselect="true"] .filter-btn:not([data-val="all"])::before {
            content: '✓';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            color: var(--gold);
            opacity: 0;
            transition: 0.2s;
        }
        .filter-group[data-multiselect="true"] .filter-btn.active:not([data-val="all"])::before {
            opacity: 1;
        }

        /* 複数選択時は視覚的に強調 */
        .filter-group[data-multiselect="true"] .filter-btn.active {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-color: var(--dark);
        }

        /* アクティブフィルターのチップ表示 */
        .active-chips-area { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; min-height: 32px; }
        .chip { background: var(--gold); color: #fff; font-size: 0.65rem; font-weight: bold; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        .chip:hover { opacity: 0.8; transform: scale(0.95); }
        .chip-close { font-size: 0.8rem; line-height: 1; }
        .clear-all { font-size: 0.6rem; color: #666; border: 1px solid #ddd; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: 12px; background: #fff; transition: 0.3s; letter-spacing: 1px; font-weight: bold; text-transform: uppercase; }
        .clear-all:hover { background: #f0f0f0; color: var(--dark); border-color: #999; }
        .active-chips-label { font-size: 0.6rem; color: #bbb; font-weight: bold; margin-right: 5px; }

        /* 商品カード：カタログのような美しさ */
        #product-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 50px; margin-top: 40px; }
        
        /* リストの登場アニメーション */
        .product-card { 
            display: flex; 
            flex-direction: column; 
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .img-container { width: 100%; height: 380px; overflow: hidden; background: var(--gray); position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .product-card:hover img { transform: scale(1.05); }
        
        .card-content { padding: 20px 0; flex-grow: 1; display: flex; flex-direction: column; }
        .brand-badge { font-size: 0.65rem; color: var(--gold); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        /* 商品名：3行分の高さを確保し、超える場合は省略（ガタつき防止） */
        .product-name { font-size: 1.05rem; font-weight: 500; margin: 10px 0; color: #000; line-height: 1.4; min-height: 4.5em; display: -webkit-box; line-clamp: 3; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        /* 説明文：3行分の高さを確保し、超える場合は省略 */
        .description { font-size: 0.85rem; color: #666; margin-bottom: 15px; min-height: 4.5em; display: -webkit-box; line-clamp: 3; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* タグリスト：高さの揺れを抑える */
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; min-height: 2.5em; align-content: flex-start; }
        .tag { font-size: 0.6rem; color: #999; border: 1px solid #eee; padding: 3px 8px; text-transform: uppercase; }
        
        /* 特典情報のテキスト */
        .promo-text { font-size: 0.75rem; color: #e67e22; font-weight: bold; margin-bottom: 10px; display: block; }

        /* もっと見るボタン */
        .load-more-container { grid-column: 1 / -1; text-align: center; margin-top: 40px; padding-bottom: 40px; }
        .btn-load-more { background: #fff; border: 1px solid var(--dark); color: var(--dark); padding: 16px 50px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 2px; text-transform: uppercase; border-radius: 2px; }
        .btn-load-more:hover { background: var(--dark); color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        /* おすすめバッジ（ラベル用） */
        .featured-badge { position: absolute; top: 10px; left: 10px; background: var(--gold); color: #fff; padding: 4px 12px; font-size: 0.7rem; font-weight: bold; z-index: 10; }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 100px 20px; color: #999; font-size: 0.9rem; letter-spacing: 2px; }

        /* モール別ボタン */
        .shop-links { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .btn-shop { text-decoration: none; padding: 12px; font-size: 0.75rem; font-weight: 700; text-align: center; border-radius: 4px; transition: 0.3s; letter-spacing: 1px; }
        .btn-amz { background: #232f3e; color: #fff; }
        .btn-rak { background: #bf0000; color: #fff; }
        .btn-a8 { background: #d35400; color: #fff; }
        .btn-yah { background: #ff0033; color: #fff; }
        .btn-shop:hover { opacity: 0.8; transform: translateY(-2px); }

    </style>
</head>
<body>

<header>
    <h1>pet925</h1>
    <div class="sub-copy">Scientific Nutrition x High Style</div>
    <div class="site-intro">
        ー愛犬・愛猫にぴったりのフードを探せるお手伝いをー
    </div>
</header>

<div class="container">
    <!-- 検索・フィルターView -->
    <div id="view-search">
        <div class="search-container">
            <div style="font-size: 0.7rem; color: #999; margin-bottom: 8px; letter-spacing: 1px;">SEARCH BY NAME, BRAND OR INGREDIENT</div>
            <input type="text" id="search-input" placeholder="商品名、ブランド、キーワードがあれば入力" oninput="render(true)">
        </div>
        <div class="filter-nav" id="filter-nav-container"></div>
        
        <div class="floating-action-area">
            <button id="main-submit-btn" class="btn-primary-action" onclick="showResults()">SHOW RESULTS</button>
        </div>
    </div>

    <!-- 結果一覧View -->
    <div id="view-results">
        <button class="btn-back-to-search" onclick="backToSearch()">← 検索条件に戻る</button>
        <div id="active-chips-container" class="active-chips-area"></div>
        <div id="product-list"></div>
        <div id="load-more-area" class="load-more-container"></div>
    </div>
</div>

<script>
// --- 状態管理 ---

// マスターデータが存在しない場合の空オブジェクト初期化（エラー防止）
if (typeof categoryMaster === 'undefined') window.categoryMaster = {};
if (typeof tagMaster === 'undefined') window.tagMaster = {};
if (typeof brandMaster === 'undefined') window.brandMaster = {};
if (typeof tagKeywords === 'undefined') window.tagKeywords = {};

let activeFilters = {}; // 内部で cat: value(or array) を保持
let searchTrackTimer = null;
let tagLookupMap = {}; // 事前生成したタグ辞書を保持
let searchWorker = null; // Web Worker インスタンス
let isWorkerReady = false;

// --- ページネーション（1万件対応用） ---
let visibleCount = 30; // 最初に見せる件数
const PAGE_SIZE = 30;  // 追加する件数

function loadMore() {
    visibleCount += PAGE_SIZE;
    render(false); // スクロール継続なのでリセットしない
}

function showResults() {
    document.body.classList.add('state-results');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    trackEvent('Navigation', 'show_results', 'click');
}

function backToSearch() {
    document.body.classList.remove('state-results');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// カテゴリが単一選択かどうかを判定するヘルパー（categoryMasterを参照）
const isMulti = (cat) => categoryMaster[cat] ? categoryMaster[cat].multi : false;

// カテゴリごとのデフォルト値を返すヘルパー
const getDefaultFilterValue = (cat) => isMulti(cat) ? [] : "all";

// 全タグの ID -> 日本語名 の変換マップを作成
const getTagLookup = () => {
    const lookup = {};
    if (typeof tagMaster !== 'undefined') {
        Object.values(tagMaster).forEach(group => Object.assign(lookup, group));
    }
    return lookup;
};

function trackEvent(category, action, label) {
    // 開発環境（localhostなど）でのみログを表示し、本番での負荷をゼロに近づける
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        console.log(`[Analytics] ${category} > ${action}: ${label}`);
    }

    // Google Analytics (GA4) にイベントを送信
    if (window.gtag) {
        gtag('event', action, {
            'event_category': category,
            'event_label': label
        });
    }
}

// --- URLと状態の同期 (GA4集計の要) ---
function updateURL() {
    const params = new URLSearchParams();
    const searchVal = document.getElementById('search-input').value.trim();
    if (searchVal) params.set('q', searchVal);

    for (const cat in activeFilters) {
        const val = activeFilters[cat];
        if (Array.isArray(val) && val.length > 0) {
            params.set(cat, val.join(','));
        } else if (typeof val === 'string' && val !== 'all') {
            params.set(cat, val);
        }
    }

    const newRelativePathQuery = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    history.replaceState(null, '', newRelativePathQuery);
    
    // GA4に仮想的なページビューを送信（クエリパラメータを認識させる）
    if (window.gtag) {
        gtag('event', 'page_view', {
            page_location: window.location.href,
            page_path: window.location.pathname + window.location.search,
            page_title: document.title
        });
    }
}

// --- ユーティリティ (正規化ロジック) ---
const normalize = (str) => {
    if (!str) return "";
    return String(str)
        .replace(/　/g, ' ') // 全角スペースを半角へ
        .normalize('NFKC') // Unicode正規化 (全角英数・記号の半角化を含む)
        .replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60)) // ひらがな -> カタカナ
        .toLowerCase()
        .trim();
};

// --- フィルター関連 ---
function initFilters() {
    if (typeof tagMaster === 'undefined') return;
    
    const params = new URLSearchParams(window.location.search);
    
    // 検索窓の初期化
    if (params.has('q')) {
        document.getElementById('search-input').value = params.get('q');
    }
    
    // 存在する全てのカテゴリ（tagMasterのキー）を初期化する
    const cats = Object.keys(tagMaster);
    for (const cat of cats) {
        if (params.has(cat)) {
            const val = params.get(cat);
            activeFilters[cat] = isMulti(cat) ? val.split(',') : val;
        } else {
            activeFilters[cat] = getDefaultFilterValue(cat);
        }
    }
}

function toggleFilter(btn) {
    const category = btn.getAttribute('data-cat');
    const value = btn.getAttribute('data-val');

    if (!isMulti(category)) {
        // 単一選択
        const isActive = btn.classList.contains('active');
        const allBtn = btn.parentElement.querySelector('[data-val="all"]');

        if (isActive && value !== 'all') { // 選択済みのボタン（「すべて」以外）を再度押したら解除
            btn.classList.remove('active');
            activeFilters[category] = getDefaultFilterValue(category);
            allBtn.classList.add('active');
        } else { // 未選択のボタンを押した、または「すべて」を押した
            btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilters[category] = value;
        }
    } else {
        // 複数選択
        if (value === 'all') {
            activeFilters[category] = [];
            btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        } else {
            const allBtn = btn.parentElement.querySelector('[data-val="all"]');
            if (activeFilters[category].includes(value)) {
                // すでに選択済みなら解除
                activeFilters[category] = activeFilters[category].filter(v => v !== value);
                btn.classList.remove('active');
            } else {
                // 未選択なら追加
                activeFilters[category].push(value);
                btn.classList.add('active');
            }

            // 選択状況に応じて「すべて」ボタンの状態を更新
            if (activeFilters[category].length === 0) allBtn.classList.add('active');
            else allBtn.classList.remove('active');
        }
    }

    trackEvent('Filter', 'select_tag', `${category}:${value}`);
    updateURL();
    visibleCount = PAGE_SIZE; // フィルター変更時はリセット
    render(false); // フィルター時は即時描画（URL更新は済んでいるのでタイマー側では行わない）
}

function toggleGroupCollapse(header) {
    const group = header.parentElement;
    group.classList.toggle('collapsed');
}

function clearAllFilters() {
    // activeFilters に存在する全てのキーに対してリセットをかける
    for (const cat in activeFilters) {
        activeFilters[cat] = (typeof tagMaster !== 'undefined' && tagMaster[cat]) ? getDefaultFilterValue(cat) : "all";
    }
    document.getElementById('search-input').value = '';
    
    // UIの表示状態を物理的にリセット（activeクラスの除去など）
    document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-val') === 'all') btn.classList.add('active');
        else btn.classList.remove('active');
    });
    
    trackEvent('Filter', 'clear_all', 'all');
    visibleCount = PAGE_SIZE; // リセット
    updateURL();
    render(false);
}

function renderFilters() {
    if (typeof tagMaster === 'undefined') return;
    
    const navContainer = document.getElementById('filter-nav-container');
    navContainer.innerHTML = '';

    for (const [category, tags] of Object.entries(tagMaster)) {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'filter-group';
        
        const catInfo = categoryMaster[category] || { jp: category, en: category.toUpperCase(), multi: false };
        if (catInfo.multi) groupDiv.setAttribute('data-multiselect', 'true');
        
        // 「すべて」ボタンがアクティブかどうかを現在の状態(activeFilters)から判定
        const isAllActive = catInfo.multi 
            ? (!activeFilters[category] || activeFilters[category].length === 0)
            : (activeFilters[category] === 'all');
        const allActiveClass = isAllActive ? 'active' : '';

        let html = `
            <div class="group-header" onclick="toggleGroupCollapse(this)">
                <span class="group-label-jp">${catInfo.jp}</span>
                <span class="group-label-en">${catInfo.en}</span>
                ${catInfo.multi ? '<span class="multi-badge">複数選択可</span>' : ''}
                <span class="collapse-icon">▲</span>
            </div>
            <div class="filter-wrap-box" id="filter-${category}">
                <button class="filter-btn ${allActiveClass}" data-cat="${category}" data-val="all" onclick="toggleFilter(this)">すべて</button>
        `;
        
        for (const [tagKey, tagName] of Object.entries(tags)) {
            const isActive = Array.isArray(activeFilters[category]) 
                ? activeFilters[category].includes(tagKey) 
                : activeFilters[category] === tagKey;
            
            const activeClass = isActive ? 'active' : '';
            html += `<button class="filter-btn ${activeClass}" data-cat="${category}" data-val="${tagKey}" onclick="toggleFilter(this)">${tagName}</button>`;
        }
        html += `</div>`;
        groupDiv.innerHTML = html;
        navContainer.appendChild(groupDiv);
    }
}

function renderActiveChips() {
    const container = document.getElementById('active-chips-container');
    const searchVal = document.getElementById('search-input').value.trim();

    let chipsHtml = '';
    let hasActive = false;

    // 検索ワード
    if (searchVal) {
        chipsHtml += `<div class="chip" onclick="document.getElementById('search-input').value='';render(true);">${searchVal} <span class="chip-close">×</span></div>`;
        hasActive = true;
    }

    // フィルタータグ
    for (const [cat, val] of Object.entries(activeFilters)) {
        const values = Array.isArray(val) ? val : (val !== 'all' ? [val] : []);
        values.forEach(v => {
            chipsHtml += `<div class="chip" onclick="removeSingleFilter('${cat}', '${v}')">${tagLookupMap[v] || v} <span class="chip-close">×</span></div>`;
            hasActive = true;
        });
    }

    if (hasActive) {
        container.innerHTML = `<span class="active-chips-label">ACTIVE:</span>` + chipsHtml + `<button class="clear-all" onclick="clearAllFilters()">CLEAR ALL ×</button>`;
    } else {
        container.innerHTML = '';
    }
}

function removeSingleFilter(cat, val) {
    const btn = document.querySelector(`.filter-btn[data-cat="${cat}"][data-val="${val}"]`);
    if (btn) toggleFilter(btn);
}

// 各サイトの最安値検索URLを生成するヘルパー
function getSearchUrl(shop, brand, name, fallbackUrl) {
    if (fallbackUrl && fallbackUrl !== '#') return fallbackUrl;
    const q = encodeURIComponent(`${brand} ${name}`);
    if (shop === 'amz') return `https://www.amazon.co.jp/s?k=${q}&s=price-asc-rank`;
    if (shop === 'rak') return `https://search.rakuten.co.jp/search/mall/${q}/?s=2`;
    if (shop === 'yah') return `https://shopping.yahoo.co.jp/search?p=${q}&ss_first=1&X=2`;
    return '#';
}

// --- ワーカーへ検索を依頼 ---
function render(isTyping = false) {
    if (!searchWorker || !isWorkerReady) return;
    if (isTyping) visibleCount = PAGE_SIZE; // 検索入力時はリセット

    const searchVal = document.getElementById('search-input').value.replace(/　/g, ' ').trim();
    const searchWords = searchVal.split(/\s+/).filter(w => w !== '').map(w => normalize(w));

    // 何らかの検索またはフィルターがアクティブか判定
    const isFiltering = searchWords.length > 0 || Object.values(activeFilters).some(val => {
        return Array.isArray(val) ? val.length > 0 : val !== 'all';
    });
    
    renderActiveChips(); // チップスの更新

    // ワーカーにデータを送信して計算を依頼
    searchWorker.postMessage({
        searchWords,
        activeFilters,
        visibleCount
    });

    // GA4計測用のタイマー（既存通り）
    clearTimeout(searchTrackTimer);
    searchTrackTimer = setTimeout(() => {
        if (isTyping) updateURL();
    }, 800);
}

// --- ワーカーからの結果を受け取って描画 ---
function handleWorkerResults(data) {
    if (data.type === 'READY') {
        isWorkerReady = true;
        if (document.getElementById('main-submit-btn')) {
            document.getElementById('main-submit-btn').textContent = `準備完了（${data.total}件）`;
        }
        return;
    }

    const { matchedItems, totalMatchCount, visibleCount: currentVisibleCount } = data;
    const list = document.getElementById('product-list');
    const loadMoreArea = document.getElementById('load-more-area');
    const submitBtn = document.getElementById('main-submit-btn');

    list.innerHTML = "";
    loadMoreArea.innerHTML = "";

    const defaultImg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 380'%3E%3Crect width='400' height='380' fill='%23f4f4f4'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='14' fill='%23bbb'%3Eno image%3C/text%3E%3C/svg%3E";

    matchedItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'product-card';
        let imageSource = (!item.img || item.img === "#" || item.img === "https://unsplash.com") ? defaultImg : item.img;

        card.innerHTML = `
            <div class="img-container">
                ${item.label ? `<div class="featured-badge">${item.label}</div>` : ''}
                <img src="${imageSource}" alt="${item.name}" onerror="this.src='${defaultImg}'" loading="lazy" decoding="async">
            </div>
            <div class="card-content">
                <span class="brand-badge">${item.brand}</span>
                <div class="product-name">${item.name}</div>
                <p class="description">${item.desc || ""}</p>
                <div class="tag-list">${item.tags.map(t => `<span class="tag">${tagLookupMap[t] || t}</span>`).join('')}</div>
                <div class="shop-links">
                    <a href="${getSearchUrl('amz', item.brand, item.name, item.amz)}" class="btn-shop btn-amz" target="_blank">Amazon</a>
                    <a href="${getSearchUrl('rak', item.brand, item.name, item.rak)}" class="btn-shop btn-rak" target="_blank">楽天</a>
                    <a href="${getSearchUrl('yah', item.brand, item.name, item.yah)}" class="btn-shop btn-yah" target="_blank">Yahoo!</a>
                </div>
            </div>`;
        list.appendChild(card);
    });

    if (submitBtn) submitBtn.textContent = `${totalMatchCount}件を表示`;
    if (totalMatchCount > currentVisibleCount) {
        loadMoreArea.innerHTML = `<button class="btn-load-more" onclick="loadMore()">さらに表示 (${totalMatchCount - currentVisibleCount}件)</button>`;
    }
    if (totalMatchCount === 0) {
        list.innerHTML = `
            <div class="no-results">NO PRODUCTS FOUND<br>条件に合う商品が見つかりませんでした</div>`;
    }
}
// ページ読み込み時に描画を開始
window.addEventListener('DOMContentLoaded', () => {
    // マスタ（tagMaster等）が読み込まれているか確認
    if (typeof tagMaster === 'undefined') return;

    tagLookupMap = getTagLookup();

    const submitBtn = document.getElementById('main-submit-btn');
    if (submitBtn) submitBtn.textContent = "データを読み込み中...";

    // ワーカーの初期化（キャッシュ回避のためタイムスタンプを付与）
    searchWorker = new Worker('search_worker.js?v=' + Date.now());
    searchWorker.onmessage = (e) => handleWorkerResults(e.data);

    initFilters();
    renderFilters();
});
</script>
