<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pet925 | CSV Data Generator</title>
    <style>
        :root { --gold: #c5a059; --dark: #1a1a1a; --gray: #f8f9fa; --border: #eee; }
        body { font-family: "Helvetica Neue", "Hiragino Sans", sans-serif; padding: 60px 20px; background: var(--gray); color: var(--dark); line-height: 1.6; margin: 0; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; padding: 50px; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); }
        
        h1 { font-size: 1.8rem; letter-spacing: 10px; font-weight: 200; text-align: center; margin: 0 0 10px; text-transform: uppercase; }
        h1 span { color: var(--gold); font-size: 0.7rem; display: block; letter-spacing: 3px; margin-top: 8px; font-weight: 700; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        
        .section-title { font-size: 0.7rem; color: var(--gold); font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin: 40px 0 20px; border-left: 3px solid var(--gold); padding-left: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { margin-bottom: 20px; }
        .field.full { grid-column: 1 / -1; }
        
        label { display: block; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; transition: all 0.3s ease; background: #fff; }
        input:focus, textarea:focus { border-color: var(--gold); outline: none; background: #fafafa; }
        
        .hint { font-size: 0.7rem; color: #999; margin-top: 3px; }
        
        .actions { display: flex; gap: 15px; margin-top: 30px; }
        button { flex: 1; padding: 20px; background: var(--dark); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        button.secondary { background: #eee; color: #666; flex: 0 0 150px; }
        button:hover { background: var(--gold); color: #fff; transform: translateY(-2px); }
        button.secondary:hover { background: #ddd; color: var(--dark); }
        
        #result-area { margin-top: 40px; display: none; padding-top: 30px; border-top: 1px solid #eee; }
        pre { background: var(--gray); padding: 25px; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; border-radius: 4px; border: 1px dashed #ddd; color: #444; font-family: monospace; }
        .copy-msg { color: var(--gold); font-size: 0.8rem; font-weight: bold; margin-top: 15px; text-align: center; letter-spacing: 1px; }
        .intro { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 40px; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h1>pet925<span>CSV DATA GENERATOR</span></h1>
    <p class="intro">マスターデータの更新をよりスマートに。入力した情報は 15列のCSV形式で生成されます。</p>

    <div class="section-title">01. Basic Information</div>
    <div class="grid">
        <div class="field full">
            <label>商品名 (name)</label>
            <input type="text" id="name" placeholder="メーカー定義の正式名称を入力">
        </div>
        <div class="field">
            <label>ブランド (brand)</label>
            <input type="text" id="brand" placeholder="例: Nutro, Royal Canin">
            <div class="hint">brands.csv の Key と揃えるのを推奨</div>
        </div>
        <div class="field">
            <label>内容量 (size)</label>
            <input type="text" id="size" placeholder="例: 2kg, 800g" autocomplete="off">
        </div>
    </div>

    <div class="section-title">02. Content & Tags</div>
    <div class="field">
        <label>タグ (tags)</label>
        <input type="text" id="tags" placeholder="例：dog adult lamb tear gf">
        <div class="hint">半角スペース区切り（animal age cond の順を推奨）</div>
    </div>
    <div class="field">
        <label>説明文 (desc)</label>
        <textarea id="desc" rows="3" placeholder="検索キーワード（素材や効果）を含めた魅力的な説明文"></textarea>
    </div>

    <div class="section-title">03. Media & Links</div>
    <div class="grid">
        <div class="field full">
            <label>画像URL (img)</label>
            <input type="text" id="img" value="#">
            <div class="hint">空（#）の場合は自動的にプレースホルダーを表示</div>
        </div>
        <div class="field">
            <label>Amazon URL (amz)</label>
            <input type="text" id="amz" value="#">
        </div>
        <div class="field">
            <label>楽天 URL (rak)</label>
            <input type="text" id="rak" value="#">
        </div>
        <div class="field">
            <label>Yahoo! URL (yah)</label>
            <input type="text" id="yah" value="#">
        </div>
        <div class="field">
            <label>公式サイト/A8リンク (a8)</label>
            <input type="text" id="a8" value="#">
        </div>
    </div>

    <div class="section-title">04. Marketing & Pricing</div>
    <div class="grid">
        <div class="field">
            <label>バッジラベル (label)</label>
            <input type="text" id="label" placeholder="例：人気No.1, 限定品">
        </div>
        <div class="field">
            <label>プロモーション (promo)</label>
            <input type="text" id="promo" placeholder="例：クーポン配布中">
        </div>
        <div class="field">
            <label>Amazon 価格 (amz_p)</label>
            <input type="number" id="amz_p" placeholder="数字のみ" autocomplete="off">
        </div>
        <div class="field">
            <label>楽天 価格 (rak_p)</label>
            <input type="number" id="rak_p" placeholder="数字のみ" autocomplete="off">
        </div>
        <div class="field">
            <label>Yahoo! 価格 (yah_p)</label>
            <input type="number" id="yah_p" placeholder="数字のみ" autocomplete="off">
        </div>
    </div>

    <div class="actions">
        <button class="secondary" onclick="resetForm()">CLEAR</button>
        <button onclick="generateCSV()">GENERATE & COPY ROW</button>
    </div>

    <div id="result-area">
        <label>OUTPUT (Copy this to products.csv):</label>
        <pre id="csv-output"></pre>
        <div class="copy-msg" id="copy-msg"></div>
    </div>
</div>

<script>
function generateCSV() {
    const fields = [
        // products.csv の厳密な列順 (15列)
        'name', 'brand', 'tags', 'desc', 'size', 'img', 
        'amz', 'rak', 'yah', 'a8', 'label', 'promo', 
        'amz_p', 'rak_p', 'yah_p'
    ];
    
    const values = fields.map(id => {
        const el = document.getElementById(id);
        let val = el ? el.value.trim() : "";
        if (!val && (id === 'rak' || id === 'yah' || id === 'amz' || id === 'a8' || id === 'img')) {
            val = "#";
        }
        // カンマが含まれる場合に備えてダブルクォーテーションで囲む
        return `"${val.replace(/"/g, '""')}"`;
    });

    const csvLine = values.join(',');
    document.getElementById('csv-output').textContent = csvLine;
    document.getElementById('result-area').style.display = 'block';

    // クリップボードにコピー
    navigator.clipboard.writeText(csvLine + '\n').then(() => {
        const msg = document.getElementById('copy-msg');
        msg.textContent = "✓ クリップボードにコピーしました！そのまま貼り付けてください。";
        setTimeout(() => { msg.textContent = ""; }, 3000);
    });
}

// Amazon価格が入力されたら、一旦他のモールにも同じ価格を自動入力する（入力の手間を省く）
document.getElementById('amz_p').addEventListener('input', (e) => {
    const p = e.target.value;
    if(!document.getElementById('rak_p').value) document.getElementById('rak_p').value = p;
    if(!document.getElementById('yah_p').value) document.getElementById('yah_p').value = p;
});

function resetForm() {
    if(!confirm('入力をすべてクリアしますか？')) return;
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(el => {
        if (['img', 'amz', 'rak', 'yah', 'a8'].includes(el.id)) {
            el.value = "#";
        } else if (el.tagName === 'TEXTAREA') {
            el.value = "";
        } else if (el.type === 'number') {
            el.value = "";
        } else {
            el.value = "";
        }
    });
    document.getElementById('result-area').style.display = 'none';
}
</script>
</body>
</html>
