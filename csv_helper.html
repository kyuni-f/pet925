<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pet925 | CSV Data Generator</title>
    <style>
        :root { --gold: #c5a059; --dark: #1a1a1a; --gray: #f4f4f4; }
        body { font-family: "Helvetica Neue", "Hiragino Sans", sans-serif; padding: 40px 20px; background: var(--gray); color: var(--dark); line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; letter-spacing: 8px; font-weight: 200; text-align: center; margin: 0 0 10px; text-transform: uppercase; }
        h1 span { color: var(--gold); font-size: 0.7rem; display: block; letter-spacing: 3px; margin-top: 8px; font-weight: 700; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 8px; color: #444; letter-spacing: 1px; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 0; box-sizing: border-box; font-size: 0.9rem; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--gold); outline: none; background: #fafafa; }
        .hint { font-size: 0.7rem; color: #999; margin-top: 3px; }
        button { width: 100%; padding: 18px; background: var(--dark); color: #fff; border: none; border-radius: 0; cursor: pointer; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; margin-top: 20px; }
        button:hover { background: var(--gold); transform: translateY(-2px); }
        #result-area { margin-top: 20px; display: none; }
        pre { background: var(--gray); padding: 20px; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; border-radius: 0; border: 1px dashed #ccc; color: #555; }
        .copy-msg { color: #27ae60; font-size: 0.8rem; font-weight: bold; margin-top: 10px; text-align: center; }
        .intro { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1>pet925<span>CSV Row Generator</span></h1>
    <p class="intro">情報を入力してボタンを押すと、スプレッドシートやCSVに貼り付けられる形式で出力します。</p>

    <div class="field">
        <label>商品名 (name)</label>
        <input type="text" id="name" placeholder="例：ナチュラル チョイス ラム＆玄米">
    </div>
    <div class="field">
        <label>ブランド (brand)</label>
        <input type="text" id="brand" placeholder="例：Nutro">
    </div>
    <div class="field">
        <label>タグ・こだわり・お悩み (tags)</label>
        <input type="text" id="tags" placeholder="例：dog adult lamb tear gf">
        <div class="hint">半角スペース区切りで入力してください（マニュアル参照）</div>
    </div>
    <div class="field">
        <label>商品説明 (desc)</label>
        <textarea id="desc" rows="3" placeholder="商品の特徴を短く入力"></textarea>
    </div>
    <div class="field">
        <label>内容量 (size)</label>
        <input type="text" id="size" placeholder="例：2kg, 800g" autocomplete="off">
    </div>
    <div class="field">
        <label>画像URL (img)</label>
        <input type="text" id="img" value="#">
        <div class="hint">空（#）の場合は自動的に「no image」画像が表示されます</div>
    </div>
    <div class="field">
        <label>公式サイト/A8リンク (a8)</label>
        <input type="text" id="a8" value="#">
    </div>
    <div class="field">
        <label>Amazon URL (amz)</label>
        <input type="text" id="amz" value="#">
    </div>
    <div class="field">
        <label>楽天 URL (rak)</label>
        <input type="text" id="rak" value="#">
    </div>
    <div class="field">
        <label>Yahoo! URL (yah)</label>
        <input type="text" id="yah" value="#">
    </div>
    <div class="field">
        <label>Amazon 価格 (amz_p)</label>
        <input type="number" id="amz_p" placeholder="数字のみ" autocomplete="off">
    </div>
    <div class="field">
        <label>楽天 価格 (rak_p)</label>
        <input type="number" id="rak_p" placeholder="数字のみ" autocomplete="off">
    </div>
    <div class="field">
        <label>Yahoo! 価格 (yah_p)</label>
        <input type="number" id="yah_p" placeholder="数字のみ" autocomplete="off">
    </div>
    <div class="field">
        <label>ラベル (label)</label>
        <input type="text" id="label" placeholder="例：人気No.1">
    </div>
    <div class="field">
        <label>特典情報 (promo)</label>
        <input type="text" id="promo" placeholder="例：初回50%OFF">
    </div>

    <button onclick="generateCSV()">CSV用の1行を生成してコピー</button>

    <div id="result-area">
        <label>生成されたデータ（そのまま貼り付け可能）:</label>
        <pre id="csv-output"></pre>
        <div class="copy-msg" id="copy-msg"></div>
    </div>
</div>

<script>
function generateCSV() {
    const fields = [
        'name', 'brand', 'tags', 'desc', 'size', 'img', 
        'amz', 'rak', 'yah', 'a8', 'label', 'promo',
        'amz_p', 'rak_p', 'yah_p'
    ];
    
    const values = fields.map(id => {
        const el = document.getElementById(id);
        let val = el ? el.value.trim() : "";
        if (!val && (id === 'rak' || id === 'yah' || id === 'amz' || id === 'a8' || id === 'img')) {
            val = "#";
        }
        // カンマが含まれる場合に備えてダブルクォーテーションで囲む
        return `"${val.replace(/"/g, '""')}"`;
    });

    const csvLine = values.join(',');
    document.getElementById('csv-output').textContent = csvLine;
    document.getElementById('result-area').style.display = 'block';

    // クリップボードにコピー
    navigator.clipboard.writeText(csvLine).then(() => {
        const msg = document.getElementById('copy-msg');
        msg.textContent = "✓ クリップボードにコピーしました！そのまま貼り付けてください。";
        setTimeout(() => { msg.textContent = ""; }, 3000);
    });
}

// Amazon価格が入力されたら、一旦他のモールにも同じ価格を自動入力する（入力の手間を省く）
document.getElementById('amz_p').addEventListener('input', (e) => {
    const p = e.target.value;
    if(!document.getElementById('rak_p').value) document.getElementById('rak_p').value = p;
    if(!document.getElementById('yah_p').value) document.getElementById('yah_p').value = p;
});
</script>

</body>
</html>
